{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Logus Consultoria{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="{% url 'home' %}" class="logo">LOGUS<span>.</span></a>
            <nav>
                <a href="{% url 'home' %}">Sobre</a>
                <a href="{% url 'sr1' %}">Serviço 1</a>
                <a href="{% url 'sr2' %}">Serviço 2</a>
                <a href="{% url 'equipe' %}">Equipe</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Logus Consultoria. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
