{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Logus Consultoria{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="{% url 'core:sobre' %}" class="logo">LOGUS<span>.</span></a>
            <nav>
                <a href="{% url 'core:sobre' %}">Sobre</a>
                <a href="{% url 'core:sr1' %}">SR1</a>
                <a href="{% url 'core:sr2' %}">SR2</a>
                <a href="{% url 'core:equipe' %}">Equipe</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Logus Consultoria. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        // Faz o conteúdo sumir antes de ir para a próxima página
        document.querySelectorAll('nav a, .logo, .btn-cta').forEach(function (link) {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                if (link.pathname === window.location.pathname) return;
                document.body.classList.add('saindo');
                setTimeout(function () { window.location.href = link.href; }, 300);
            });
        });

        // Ao voltar pelo botão "voltar" do navegador, limpa o estado de saída
        window.addEventListener('pageshow', function () {
            document.body.classList.remove('saindo');
        });
    </script>
</body>
</html>
